<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Teste do carrinho (provisório)</title>
<!-- SPIKE — throwaway. Same framing as site/index.html. Delete after wayfinder/checkout ticket 005. -->
<style>
  html, body { margin: 0; height: 100%; background: #143628; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbzCCZYoRuQBB5FGX0bRWHH3av7AzfTTXgICNEhdcMs6aMeYnhawN5Kn0Tf2hgXJbkzS/exec';
  var KEY = 'spike-cart';
  function read() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return { error: e.name }; } }
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.spike !== true || !e.source) return;
    if (e.data.type === 'save') { try { localStorage.setItem(KEY, JSON.stringify(e.data.cart)); } catch (err) { /* reported via state */ } }
    e.source.postMessage({ spike: true, type: 'state', cart: read(), outerOrigin: location.origin, seenInnerOrigin: e.origin }, e.origin);
  });
  var frame = document.createElement('iframe');
  frame.title = 'Teste do carrinho';
  frame.src = EXEC;
  frame.allow = 'clipboard-write';
  document.body.appendChild(frame);
</script>
</body>
</html>
